init
reset halt
sleep 100

echo "===== CPU ====="
reg pc
reg msp
reg xpsr

echo "===== RCC ====="
mrw 0x58024400
mrw 0x58024408
mrw 0x58024410
mrw 0x58024414
mrw 0x58024418
mrw 0x58024430
mrw 0x58024440
mrw 0x58024444
mrw 0x580244E0

echo "===== GPIOD ====="
mrw 0x58020C00
mrw 0x58020C04
mrw 0x58020C08
mrw 0x58020C0C
mrw 0x58020C20
mrw 0x58020C24

echo "===== USART3 ====="
mrw 0x40004800
mrw 0x40004804
mrw 0x40004808
mrw 0x4000480C
mrw 0x4000481C
mrw 0x40004828

echo "===== NVIC ISER ====="
mrw 0xE000E100
mrw 0xE000E104

echo "===== Check SystemCoreClock at its address ====="
# SystemCoreClock is at 0x20000000 (start of DTCMRAM where .data is)
mrw 0x20000000
mrw 0x20000004
mrw 0x20000008
mrw 0x2000000C
mrw 0x20000010

exit
