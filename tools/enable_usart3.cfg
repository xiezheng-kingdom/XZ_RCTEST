init
halt
sleep 200

echo "===== Before ====="
mrw 0x40004800
mrw 0x4000480C
mrw 0x4000481C

echo "===== Set USART3 BRR for 115200 @ 64MHz PCLK ====="
# PCLK1=64MHz (D1CFGR=0,D2CFGR=0: SYSCLK=HSI=64MHz, HCLK/1, PCLK1/1)
# BRR = 64000000/115200 = 555.55 -> mantissa=555, frac=9
mww 0x4000480C 0x000022B9
sleep 10

echo "===== Enable USART3: UE=1, TE=1, RE=1 ====="
mww 0x40004800 0x0000000D
sleep 50

echo "===== After ====="
mrw 0x40004800
mrw 0x4000480C
mrw 0x4000481C

echo "===== Send 'Hello' via USART3 ====="
mww 0x40004828 0x48
sleep 10
mww 0x40004828 0x65
sleep 10
mww 0x40004828 0x6C
sleep 10
mww 0x40004828 0x6C
sleep 10
mww 0x40004828 0x6F
sleep 50

echo "===== Final ISR ====="
mrw 0x4000481C
exit
