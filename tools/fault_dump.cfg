init
reset halt
after 100

set f [open "c:/Users/Xiezheng_kingdom/Desktop/PZtest/tools/fault_result.txt" w]

puts $f "=== FRESH RESET STATE ==="
set val [reg pc]
puts $f "PC: $val"
set val [reg sp]
puts $f "SP: $val"
set val [reg lr]
puts $f "LR: $val"
set val [reg msp]
puts $f "MSP: $val"

puts $f "\n=== Fault Registers (after reset) ==="
set val [mdw 0xE000ED28 1]
puts $f "CFSR: $val"
set val [mdw 0xE000ED2C 1]
puts $f "HFSR: $val"
set val [mdw 0xE000ED04 1]
puts $f "ICSR: $val"

puts $f "\n=== RCC after reset ==="
set val [mdw 0x58024400 1]
puts $f "D3_APB1LENR: $val"
set val [mdw 0x580244E0 1]
puts $f "D3_AHB4ENR: $val"

puts $f "\n=== Running for 2 seconds ==="
resume
after 2000
halt

puts $f "\n=== AFTER 2s RUN ==="
set val [reg pc]
puts $f "PC: $val"
set val [reg sp]
puts $f "SP: $val"
set val [reg lr]
puts $f "LR: $val"
set val [reg msp]
puts $f "MSP: $val"
set val [reg psp]
puts $f "PSP: $val"

puts $f "\n=== Fault Registers (after 2s) ==="
set val [mdw 0xE000ED28 1]
puts $f "CFSR: $val"
set val [mdw 0xE000ED2C 1]
puts $f "HFSR: $val"
set val [mdw 0xE000ED04 1]
puts $f "ICSR: $val"
set val [mdw 0xE000ED24 1]
puts $f "SHCSR: $val"
set val [mdw 0xE000ED34 1]
puts $f "MMFAR: $val"
set val [mdw 0xE000ED38 1]
puts $f "BFAR: $val"

puts $f "\n=== RCC after 2s ==="
set val [mdw 0x58024400 1]
puts $f "D3_APB1LENR: $val"
set val [mdw 0x580244E0 1]
puts $f "D3_AHB4ENR: $val"
set val [mdw 0x58024408 1]
puts $f "D3_APB2LENR: $val"
set val [mdw 0x580244D0 1]
puts $f "D3_AHB1LENR: $val"

puts $f "\n=== Peripherals after 2s ==="
set val [mdw 0x40004800 1]
puts $f "USART3_CR1: $val"
set val [mdw 0x4000480C 1]
puts $f "USART3_BRR: $val"
set val [mdw 0x4000481C 1]
puts $f "USART3_ISR: $val"
set val [mdw 0x40007800 1]
puts $f "UART7_CR1: $val"
set val [mdw 0x40005400 1]
puts $f "I2C1_CR1: $val"

puts $f "\n=== GPIO ==="
set val [mdw 0x40020C00 1]
puts $f "GPIOD_MODER: $val"
set val [mdw 0x40020C24 1]
puts $f "GPIOD_AFRH: $val"

puts $f "\n=== NVIC ==="
set val [mdw 0xE000E100 1]
puts $f "ISER0: $val"
set val [mdw 0xE000E104 1]
puts $f "ISER1: $val"

close $f
echo "Done"
exit
