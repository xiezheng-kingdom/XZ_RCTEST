init
reset run
after 2000
halt

set f [open "c:/Users/Xiezheng_kingdom/Desktop/PZtest/tools/regdump.txt" w]

puts $f "=== Fault Analysis ==="

set val [stm32h7x.cpu0 mdw 0xE000ED28 2]
puts $f "CFSR+HFSR: $val"

set val [stm32h7x.cpu0 mdw 0xE000EDF0 1]
puts $f "ICSR: $val"

# Check LR and stacked PC from MSP
set val [stm32h7x.cpu0 mdw 0x2001FF78 8]
puts $f "Stack near MSP (0x2001FF78): $val"

set val [stm32h7x.cpu0 mdw 0x58024400 1]
puts $f "RCC_APB1LENR: $val"

set val [stm32h7x.cpu0 mdw 0x580244E0 1]
puts $f "RCC_AHB4ENR: $val"

set val [stm32h7x.cpu0 mdw 0x58024408 1]
puts $f "RCC_D2CCIPR: $val"

set val [stm32h7x.cpu0 mdw 0x40004800 1]
puts $f "USART3_CR1: $val"

set val [stm32h7x.cpu0 mdw 0x40005400 1]
puts $f "I2C1_CR1: $val"

close $f
exit
