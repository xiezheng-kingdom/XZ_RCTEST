init
reset halt
after 100

set val [stm32h7x.cpu0 mdw 0x58024400 1]
puts "RCC_APB1LENR_D3: $val"

set val [stm32h7x.cpu0 mdw 0x580244E0 1]
puts "RCC_AHB4ENR_D3: $val"

set val [stm32h7x.cpu0 mdw 0x40020C00 1]
puts "GPIOD_MODER: $val"

set val [stm32h7x.cpu0 mdw 0x40020C24 1]
puts "GPIOD_AFRH: $val"

set val [stm32h7x.cpu0 mdw 0x40004800 1]
puts "USART3_CR1: $val"

set val [stm32h7x.cpu0 mdw 0x4000480C 1]
puts "USART3_BRR: $val"

set val [stm32h7x.cpu0 mdw 0x4000481C 1]
puts "USART3_ISR: $val"

set val [stm32h7x.cpu0 mdw 0x40004828 1]
puts "USART3_TDR: $val"

set val [stm32h7x.cpu0 mdw 0xE000ED28 1]
puts "CFSR: $val"

set val [stm32h7x.cpu0 mdw 0xE000ED2C 1]
puts "HFSR: $val"

puts ""
puts "PC was at 0x08001740 - reading nearby flash:"
set val [stm32h7x.cpu0 mdw 0x08001730 8]
puts "Flash @0x08001730: $val"

resume
exit
