init
reset halt

set f [open "c:/Users/Xiezheng_kingdom/Desktop/PZtest/tools/verify_result.txt" w]

puts $f "=== Reset state ==="
set val [reg pc]
puts $f "PC: $val"

puts $f "\n=== Running 3 seconds ==="
resume
after 3000
halt

puts $f "\n=== After 3s ==="
set val [reg pc]
puts $f "PC: $val"
set val [reg sp]
puts $f "SP: $val"
set val [reg lr]
puts $f "LR: $val"

puts $f "\n=== Fault ==="
set val [mdw 0xE000ED28 1]
puts $f "CFSR: $val"
set val [mdw 0xE000ED2C 1]
puts $f "HFSR: $val"
set val [mdw 0xE000ED04 1]
puts $f "ICSR: $val"

puts $f "\n=== USART3 ==="
set val [mdw 0x40004800 1]
puts $f "USART3_CR1: $val"
set val [mdw 0x4000480C 1]
puts $f "USART3_BRR: $val"
set val [mdw 0x4000481C 1]
puts $f "USART3_ISR: $val"

puts $f "\n=== I2C1 ==="
set val [mdw 0x40005400 1]
puts $f "I2C1_CR1: $val"
set val [mdw 0x40005418 1]
puts $f "I2C1_ISR: $val"

close $f
echo "Done"
exit
