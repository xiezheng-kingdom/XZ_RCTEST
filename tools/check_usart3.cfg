init
reset halt
after 100

echo "=== RCC_APB1LENR (bit14=USART3EN, bit30=UART7EN) ==="
stm32h7x.cpu0 mdw 0x40024400 1

echo "=== RCC_AHB4ENR (bit3=GPIODEN) ==="
stm32h7x.cpu0 mdw 0x400244E0 1

echo "=== GPIOD_MODER ==="
stm32h7x.cpu0 mdw 0x40020C00 1

echo "=== GPIOD_AFRH ==="
stm32h7x.cpu0 mdw 0x40020C24 1

echo "=== USART3_CR1 ==="
stm32h7x.cpu0 mdw 0x40004800 1

echo "=== USART3_BRR ==="
stm32h7x.cpu0 mdw 0x4000480C 1

echo "=== USART3_ISR ==="
stm32h7x.cpu0 mdw 0x4000481C 1

echo "=== USART3_TDR ==="
stm32h7x.cpu0 mdw 0x40004828 1

echo "=== CFSR (fault) ==="
stm32h7x.cpu0 mdw 0xE000ED28 1

echo "=== HFSR ==="
stm32h7x.cpu0 mdw 0xE000ED2C 1

resume
exit
